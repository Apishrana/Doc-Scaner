[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Apish rana", email = "apishrana682@gmail.com" },
    { name = "Shresth nanwani", email = "nanwanishresth@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt==4.0.1",
    "dotenv>=0.9.9",
    "fastapi[all]>=0.162.0",
    "jose>=1.0.0",
    "passlib>=1.7.4",
    "psycopg2[binary]>=2.9.13",
    "psycopg[binary]>=3.3.9",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.50",
    "supabase>=2.33.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
